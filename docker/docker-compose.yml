version: "3.8"

services:
  homeassistant:
    container_name: homeassistant-phomemo
    image: homeassistant/home-assistant:2026.1
    volumes:
      # Mount Home Assistant config directory
      - ./ha_config:/config
      # Mount custom component directly into HA
      - ../custom_components/phomemo_d30:/config/custom_components/phomemo_d30:ro
      # Mount test prints directory
      - ./test_prints:/config/phomemo_prints
    environment:
      - TZ=Europe/Amsterdam
    restart: unless-stopped
    network_mode: host
    privileged: true
    # Required for Bluetooth access
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    ports:
      - "8123:8123"

  # mosquitto:
  #   container_name: mosquitto-phomemo
  #   image: eclipse-mosquitto:2.0
  #   volumes:
  #     - ./mosquitto/config:/mosquitto/config
  #     - ./mosquitto/data:/mosquitto/data
  #     - ./mosquitto/log:/mosquitto/log
  #   ports:
  #     - "1883:1883"
  #     - "9001:9001"
  #   restart: unless-stopped
  #   networks:
  #     - ha-network

networks:
  ha-network:
    driver: bridge
